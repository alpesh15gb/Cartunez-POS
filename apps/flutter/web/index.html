<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cartunez POS: billing, stock and sales for the parts counter.">
  <meta name="theme-color" content="#14221F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cartunez POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Cartunez POS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14221F; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px; font: 600 15px system-ui, "Segoe UI", Roboto, sans-serif;
      color: #C4EC78; transition: opacity .25s ease; }
    #splash img { width: 72px; height: 72px; border-radius: 18px; }
    #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: rgba(196,236,120,.2); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #C4EC78;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Opening Cartunez POS">
    <img src="icons/Icon-192.png" alt="">
    <div>Cartunez POS</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
