# Nginx inside the cartunezshop project. Host Nginx terminates HTTPS and sends
# X-Forwarded-Proto: https, which Magento reads to know the request is secure.
upstream fastcgi_backend {
    server php:9000;
}

server {
    listen 8080;
    server_name shop.cartunez.in;
    client_max_body_size 32m;

    # Real visitor address from host Nginx (the only proxy in front).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    set $MAGE_ROOT /var/www/magento;
    set $MAGE_DEBUG_SHOW_ARGS 0;
    include /var/www/magento/nginx.conf.sample;
}
