# Install this server block under the host Nginx http context.
# Copy apps/flutter/release/web to /srv/motorline/web and provision the certificate below.
server {
    listen 80;
    server_name pos.shop.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pos.shop.local;
    ssl_certificate /etc/nginx/tls/motorline.crt;
    ssl_certificate_key /etc/nginx/tls/motorline.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/motorline/web;
    index index.html;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location = /sw.js { add_header Cache-Control "no-store"; }
    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
